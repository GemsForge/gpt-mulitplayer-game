name: Challenge-ready checks

on:
  pull_request:
    branches:
      - master
      - feature/1-bootstrap-react-architecture
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  commit-messages:
    name: Validate commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Conventional Commit story format
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|chore|refactor)(\([a-z0-9-]+\))?: #[0-9]+ .+'
          failed=0
          while IFS= read -r subject; do
            if [[ ! "$subject" =~ $pattern ]]; then
              echo "Invalid commit message: $subject"
              failed=1
            fi
          done < <(git log --format=%s "$BASE_SHA..$HEAD_SHA")
          if (( failed )); then
            echo "Commit messages must match: <type>[(<scope>)]: #<story-number> <imperative summary>"
            exit 1
          fi

  pr-sync:
    name: Validate PR and story sync
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Check linked story and matching title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          body="$(gh pr view "$PR_NUMBER" --json body --jq '.body')"
          story_number="$(printf '%s' "$body" | sed -nE 's/.*(Closes|Fixes) #[[:space:]]*([0-9]+).*/\2/p' | head -n1)"
          test -n "$story_number" || { echo 'PR must contain Closes #<story-number> or Fixes #<story-number>'; exit 1; }
          story_title="$(gh issue view "$story_number" --json title --jq '.title')"
          test "$PR_TITLE" = "$story_title" || { echo "PR title does not match issue #$story_number title"; exit 1; }
          [[ "$HEAD_BRANCH" == *"/$story_number-"* ]] || { echo "Branch must include /$story_number-"; exit 1; }

  label-policy:
    name: Validate label policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    steps:
      - name: Check PR and story labels are synchronized
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          payload="$(gh pr view "$PR_NUMBER" --json body,labels --jq '{body: .body, labels: [.labels[].name]}')"
          story_number="$(jq -r '.body' <<< "$payload" | sed -nE 's/.*(Closes|Fixes) #[[:space:]]*([0-9]+).*/\2/p' | head -n1)"
          test -n "$story_number" || { echo 'Cannot apply label policy without a linked story'; exit 1; }
          pr_labels="$(jq -c '.labels | sort' <<< "$payload")"
          issue_labels="$(gh issue view "$story_number" --json labels --jq '[.labels[].name] | sort')"
          test "$pr_labels" != '[]' || { echo 'PR must have at least one label'; exit 1; }
          test "$pr_labels" = "$issue_labels" || { echo "PR labels $pr_labels do not match issue #$story_number labels $issue_labels"; exit 1; }
